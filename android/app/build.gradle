plugins { id 'com.android.application' }
android {
    namespace 'com.characterstudio.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.characterstudio.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
}

def webDist = rootProject.projectDir.parentFile.toPath().resolve('web-dist').toFile()
tasks.register('copyWebAssets', Sync) {
    from(webDist)
    into(file('src/main/assets/www'))
}
tasks.named('preBuild').configure {
    dependsOn('copyWebAssets')
}
