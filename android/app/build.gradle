plugins { id 'com.android.application' }
android {
    namespace 'com.characterstudio.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.characterstudio.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

def webRoot = rootProject.projectDir.parentFile
tasks.register('copyWebAssets', Copy) {
    from(webRoot) {
        include 'index.html', 'styles.css', 'app.js'
    }
    into(file('src/main/assets/www'))
}
tasks.named('preBuild').configure {
    dependsOn('copyWebAssets')
}
